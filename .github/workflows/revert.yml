name: Restore Repo to Specific State
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Commit and Commit Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # This identifies the current branch automatically (e.g., android16-aptusitu)
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch is $CURRENT_BRANCH"

          # 1. Force the files to match your target commit
          git reset --hard 0aa11e68bf2525f2a02da605766437d9cb423dab

          # 2. Point back to the remote branch tip without changing the files
          # This makes Git think you just manually edited everything to match 0aa11e6
          git reset --soft origin/$CURRENT_BRANCH

          # 3. Create the 'Restore' commit
          git commit -m "Restoring repository state to 0aa11e6"

          # 4. Push it back
          git push origin $CURRENT_BRANCH
